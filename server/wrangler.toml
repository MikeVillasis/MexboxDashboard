name = "mexbox-activity"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false   # no per-version public URLs; only the deployed version is reachable

# The Activity front end (built by ../activity, `npm run deploy` builds it first) is served from this same origin,
# so Discord needs a single URL mapping. API paths, with or without Discord's /.proxy prefix, reach the Worker.
[assets]
directory = "../activity/dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/.proxy/*"]

[vars]
# Public values only. DISCORD_CLIENT_ID = the Application ID from the Discord developer portal (public by design).
DISCORD_CLIENT_ID = "1562463240532004874"
EXTRA_ORIGINS = ""         # comma-separated extra allowed Origins for local testing only; keep empty in production

# Secrets (never in this file or the repo), set from this folder:
#   npx wrangler secret put DISCORD_CLIENT_SECRET
#   npx wrangler secret put ALLOWED_GUILD_IDS      (comma-separated server IDs; unset/empty = reject everyone)
#   npx wrangler secret put DISCORD_BOT_TOKEN      (optional: thought bubbles; needs the Presence intent)
# Local dev reads them from server/.dev.vars (git-ignored).

[[d1_databases]]
binding = "DB"
database_name = "mexbox"
database_id = "530c1a92-19d3-49ff-b7f3-32bf528e31a2"   # from: npx wrangler d1 create mexbox
migrations_dir = "migrations"

# Shared plaza rooms (SQLite-backed Durable Objects are the free-plan kind).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "PlazaRoom"

# One Discord Gateway connection (bot) for thought bubbles; connected only while a room has people in it.
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlazaRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PresenceHub"]

# Caps calls that reach Discord (token exchange, uncached sign-in checks), per client IP, so nobody can burn the
# app's Discord rate limit. Inside Discord members may share the proxy's IPs; a launch costs about 2, so 60/min is ample.
[[ratelimits]]
name = "DISCORD_CALLS"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[observability]
enabled = true
